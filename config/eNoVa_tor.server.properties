# =============================================================================
# eNoVa-Tor – Server Properties
# All network settings are configurable. Nothing is hard-coded in the binary.
# Environment overrides (optional): ENOVA_URLS, ENOVA_BIND, ENOVA_PORT,
#   ENOVA_BASEURL, ENOVA_NETWORK_MODE, ENOVA_SIGNING_ENABLED, ENOVA_ALLOWED_HOSTS, ENOVA_DB
# =============================================================================

# --- Crypto ---
enova.crypto.provider=MOCK_FALLBACK
# false = no inbound signature check, no outbound QES (pure answer). true = enable.
enova.crypto.signing.enabled=false
enova.vda.rest.endpoint=https://d-trust.de

# --- Organisation defaults ---
enova.authority.identifier=DE-LRAGRZ-01
enova.sender.name=LRA-GRZ

# --- Networking ---
# mode: local  = bind loopback only (default, safest for single-machine)
#       lan    = bind all interfaces (0.0.0.0), for internal network clients
#       public = bind all interfaces; put TLS terminator in front
#       custom = use enova.network.bind + enova.network.port as given
enova.network.mode=local
enova.network.bind=127.0.0.1
enova.network.port=5101
# Optional explicit listen URL(s). If set, overrides mode/bind/port.
# Examples: http://0.0.0.0:5101
#           http://10.0.0.50:8080
# enova.server.listenurl=

# URL that *clients* must use (scheme://host:port). May differ from bind
# when behind reverse proxy / NAT (e.g. https://enova.example.local).
enova.server.baseurl=http://localhost:5101

# Host header allow-list (* = any)
enova.network.allowedhosts=*
# Honour X-Forwarded-For / Proto when behind a reverse proxy
enova.network.forwardedheaders=true
# Optional sub-path if the API is not at domain root (e.g. /enova)
# enova.network.pathbase=

# --- Upload / seed ---
enova.upload.enabled=false
enova.upload.api.endpoint=http://localhost:5101/api/documents
enova.seed.all=true
