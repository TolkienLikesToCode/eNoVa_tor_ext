# =============================================================================
# eNoVa-Tor – Client Properties
# The client does not discover the server. Set the base URL before first contact.
# =============================================================================

# Required: API base URL (http or https)
enova.server.baseurl=http://127.0.0.1:5101

# Local default until /api/config is applied after login (server wins)
enova.crypto.signing.enabled=false

enova.local.output.directory=%USERPROFILE%\Documents\eNoVa_tor
enova.output.antworten=antworten
enova.output.ablage=ablage
